<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Tarefa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        label {
            font-weight: bold;
            color: #333;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            margin-top: 10px;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Cadastrar Nova Tarefa</h1>
        
        <a href="{{ url_for('pagina_inicial') }}">← Voltar para a lista</a>
        
        <form method="POST">
            <label for="titulo">Título da Tarefa:</label>
            <input type="text" id="titulo" name="titulo" required>

            <label for="disciplina">Disciplina:</label>
            <input type="text" id="disciplina" name="disciplina" required>

            <label for="descricao">Descrição / Detalhes:</label>
            <textarea id="descricao" name="descricao" rows="4"></textarea>

            <label for="prazo">Data e Hora do Prazo:</label>
            <input type="datetime-local" id="prazo" name="prazo" required>

            <button type="submit">Salvar Tarefa</button>
        </form>
    </div>
</body>
</html>
