<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Tarefa</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 30px auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Cadastrar Nova Tarefa 📝</h1>
    <a href="{{ url_for('pagina_inicial') }}">← Voltar para a lista</a>
    <hr>
    <form method="POST">
        <label>Título:</label>
        <input type="text" name="titulo" required>

        <label>Disciplina:</label>
        <input type="text" name="disciplina" required>

        <label>Descrição:</label>
        <textarea name="descricao" rows="4"></textarea>

        <label>Prazo:</label>
        <input type="datetime-local" name="prazo" required>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
